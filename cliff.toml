# git-cliff configuration: release notes from conventional commits (see CONTRIBUTING.md).

[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}(https://github.com/empty-sekai/ournotes-player/compare/{{ previous.version }}..{{ version }})\
{% else %}(https://github.com/empty-sekai/ournotes-player/releases/tag/{{ version }}){% endif %} \
— {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | sort(attribute="committer.timestamp") -%}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.scope %} _({{ commit.scope }})_{% endif %}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  # Breaking changes stay visible even when the commit type is housekeeping (a refactor with a BREAKING CHANGE footer).
  { body = "BREAKING CHANGE", group = "<!-- 4 -->Breaking Changes" },
  # Housekeeping types (refactor, test, ci, build, chore, style, revert) are kept out of the release notes.
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
