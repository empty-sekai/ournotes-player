name: release

# Triggered by a v* tag (release) or manual dispatch (dry run: tests, builds and packs, but never publishes to npm or
# creates a GitHub release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release run per ref; a re-pushed tag cancels the stale run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- 1. Tests and build. Gates everything else. -------------------------------------------------------------------
  build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/build.mjs --check

      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CURRENT="$(node -p "require('./package.json').version")"
          if [[ "${CURRENT}" != "${VERSION}" ]]; then
            echo "package.json version ${CURRENT} does not match tag ${VERSION}" >&2
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            out/*.tgz
            dist/
          if-no-files-found: error

  # -- 2. npm publish with provenance. -------------------------------------------------------------------------------
  publish:
    name: npm publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance / trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifact

      - name: Publish
        run: |
          npm install -g npm@latest
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE="$(node -p "require('./package.json').name")"
          TARBALL="$(ls artifact/out/*.tgz)"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            set -- --access public --provenance --tag next
          else
            set -- --access public --provenance
          fi
          # Check the end state rather than predicting it: a re-pushed tag has to succeed whether this run published
          # the version or an earlier one did.
          if npm publish "${TARBALL}" "$@"; then
            echo "published ${PACKAGE}@${VERSION}"
          elif npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already on the registry; nothing to publish"
          else
            echo "npm publish failed and ${VERSION} is not on the registry" >&2
            exit 1
          fi

  # -- 3. GitHub release: notes from git-cliff, the bundles attached. -------------------------------------------------
  # The changelog is generated fresh and used as the release body only; nothing is committed back.
  release:
    name: github release
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifact

      - name: Assemble release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifact/out/*.tgz release/
          (cd artifact && zip -r "../release/ournotes-player-dist-${VERSION}.zip" dist)
          (cd release && sha256sum ./* > SHA256SUMS)
          ls -la release
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
