<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chart data</title>
<!-- Chart data of a site: rankings (efficiency, event rank, speed, level, notes, length, skip), charts and a guide over the site's
     music-data.json (nnnotes music-data, with the ournotes-deck statistics unless made with --no-deck) and jackets/
     (nnnotes music-data --jackets, optional). Songs link to their moenotes page. See songs.js for the query parameters.
     The look is moenotes' (bdon.moe, its Sirius theme): the --mn-* tokens below carry its values and names
     (moenotes src/styles/tokens.css and themes.css), so the page sits in moenotes without a second palette. -->
<style>
  :root {
    --mn-bg: #EEF2FA; --mn-surface: rgba(247, 250, 255, .92); --mn-surface-strong: rgba(247, 250, 255, .97);
    --mn-glass: rgba(247, 250, 255, .64); --mn-glass-border: rgba(163, 183, 219, .52); --mn-glass-highlight: rgba(255, 255, 255, .85);
    --mn-glass-shadow: 0 12px 36px rgba(48, 72, 122, .09);
    --mn-text: #202E4C; --mn-ink-soft: #3D506F; --mn-text-muted: #596B87; --mn-border: #C5D1E6; --mn-cream-deep: #E3EAF7;
    --mn-paper: #F7FAFF; --mn-accent: #5475BC; --mn-accent-deep: #395EA8; --mn-accent-soft: #E1EAFB;
    --mn-pink: #C3B8EC; --mn-pink-soft: #EEE9FA; --mn-cyan: #A0DDEA; --mn-amber: #EAD0A6; --mn-peach: #F8D3B8;
    --mn-yellow: #F7E9AD; --mn-mint: #B9D5B1; --mn-mint-deep: #3F5740; --mn-mint-soft: #E4EBDD; --mn-rose: #B85C6B;
    --mn-dot-ink: rgba(39, 62, 112, .06);
    --mn-shadow: 0 4px 20px -2px rgba(39, 62, 112, .05), 0 2px 6px -1px rgba(39, 62, 112, .03);
    --mn-shadow-stamp-sm: 0 2px 6px -1px rgba(39, 62, 112, .04), 0 1px 2px -1px rgba(39, 62, 112, .02);
    --mn-orbit-night: rgba(129, 162, 211, .23); --mn-orbit-light: #304e7e; --mn-orbit-edge: rgba(101, 144, 202, .52);
    --mn-orbit-heading: linear-gradient(168deg, rgba(159, 184, 223, .30) 70%, rgba(142, 180, 222, .42) 70.3%, rgba(188, 204, 231, .22) 72%);
    --mn-overlay-scrim: rgba(7, 15, 34, .56); --mn-overlay-shadow: 0 28px 100px #030b2533, 0 0 0 1px #a9cfff18;
    --mn-panel-fill: linear-gradient(135deg, color-mix(in srgb, var(--mn-cyan) 7%, var(--mn-paper)), var(--mn-paper) 55%, color-mix(in srgb, var(--mn-pink) 6%, var(--mn-paper)));
    --mn-font: "Inter", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    --mn-font-note: "SFMono-Regular", Consolas, monospace;
    /* difficulty accents: moenotes' chips (Tailwind cyan / emerald / amber / rose) */
    --easy: #06b6d4; --normal: #10b981; --hard: #f59e0b; --expert: #f43f5e;
    --easy-bg: #cffafe; --easy-ink: #155e75; --easy-line: #a5f3fc;
    --normal-bg: #d1fae5; --normal-ink: #065f46; --normal-line: #a7f3d0;
    --hard-bg: #fef3c7; --hard-ink: #92400e; --hard-line: #fde68a;
    --expert-bg: #ffe4e6; --expert-ink: #9f1239; --expert-line: #fecdd3;
    --cut: 3px 24px 3px 24px; --cut-md: 3px 18px 3px 18px; --cut-sm: 2px 12px 2px 12px;
  }
  html[data-theme="dark"] {
    --mn-bg: #080F21; --mn-surface: rgba(16, 27, 49, .92); --mn-surface-strong: rgba(23, 36, 62, .97);
    --mn-glass: rgba(13, 23, 43, .72); --mn-glass-border: rgba(146, 182, 233, .22); --mn-glass-highlight: rgba(203, 226, 255, .14);
    --mn-glass-shadow: 0 16px 44px rgba(0, 5, 20, .28);
    --mn-text: #EAF1FF; --mn-ink-soft: #D2DDF3; --mn-text-muted: #A0B0CD; --mn-border: #2C3D5E; --mn-cream-deep: #17243F;
    --mn-paper: #101B31; --mn-accent: #9ACBFA; --mn-accent-deep: #B2D8FF; --mn-accent-soft: #1C3453;
    --mn-pink: #C4BAF1; --mn-pink-soft: #29233F; --mn-cyan: #9ADAE9; --mn-amber: #EDCE95; --mn-peach: #F0C4A4;
    --mn-yellow: #F6E79E; --mn-mint: #94C78B; --mn-mint-deep: #99D3B1; --mn-mint-soft: #182F32; --mn-rose: #D47888;
    --mn-dot-ink: rgba(175, 206, 255, .16);
    --mn-shadow: 0 4px 20px -2px rgba(0, 0, 0, .3), 0 2px 6px -1px rgba(0, 0, 0, .2);
    --mn-shadow-stamp-sm: 0 2px 6px -1px rgba(0, 0, 0, .2), 0 1px 2px -1px rgba(0, 0, 0, .15);
    --mn-orbit-night: rgba(100, 148, 205, .24); --mn-orbit-light: #d5eaff; --mn-orbit-edge: rgba(152, 202, 240, .48);
    --mn-orbit-heading: linear-gradient(168deg, rgba(92, 130, 180, .27) 70%, rgba(121, 174, 216, .38) 70.3%, rgba(84, 120, 163, .22) 72%);
    --mn-overlay-scrim: rgba(2, 6, 18, .72); --mn-overlay-shadow: 0 28px 100px #0009, 0 0 36px #83baff0a;
    --easy-bg: rgba(8, 51, 68, .4); --easy-ink: #22d3ee; --easy-line: rgba(22, 78, 99, .5);
    --normal-bg: rgba(2, 44, 34, .4); --normal-ink: #34d399; --normal-line: rgba(6, 78, 59, .5);
    --hard-bg: rgba(69, 26, 3, .4); --hard-ink: #fbbf24; --hard-line: rgba(120, 53, 15, .5);
    --expert-bg: rgba(76, 5, 25, .4); --expert-ink: #fb7185; --expert-line: rgba(136, 19, 55, .5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--mn-bg); color: var(--mn-text); font: 14px/1.6 var(--mn-font); -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh; margin: 0; background-color: var(--mn-bg);
    background-image:
      radial-gradient(ellipse at 85% 5%, color-mix(in srgb, var(--mn-pink) 25%, transparent), transparent 48%),
      radial-gradient(ellipse at 10% 45%, color-mix(in srgb, var(--mn-cyan) 19%, transparent), transparent 55%),
      radial-gradient(circle at 17px 31px, var(--mn-dot-ink) 1px, transparent 1.6px),
      radial-gradient(circle at 71px 83px, var(--mn-dot-ink) .7px, transparent 1.4px);
    background-size: 100% 100%, 100% 100%, 137px 173px, 211px 257px; background-attachment: fixed;
  }
  body.locked { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--mn-accent-deep); }
  :where(button, a, input, select, [tabindex]):focus-visible { outline: 2px solid var(--mn-accent); outline-offset: 3px; }
  ::selection { background: color-mix(in oklab, var(--mn-accent) 18%, transparent); }
  .ic { width: 16px; height: 16px; flex: none; }
  .num, .tabular { font-variant-numeric: tabular-nums; }
  .wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 24px; }

  /* glass surfaces: moenotes .mn-glass / .mn-paper */
  .glass {
    border: 1px solid var(--mn-glass-border); border-radius: var(--cut);
    background: linear-gradient(135deg, color-mix(in srgb, var(--mn-glass-highlight) 24%, transparent), transparent 48%), var(--mn-glass);
    box-shadow: inset 0 1px 0 var(--mn-glass-highlight), var(--mn-glass-shadow);
    -webkit-backdrop-filter: blur(22px) saturate(135%); backdrop-filter: blur(22px) saturate(135%);
  }

  /* header: moenotes #header-card */
  .top { position: sticky; top: 0; z-index: 20; padding-top: 12px; }
  .appbar {
    display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 8px 12px 8px 18px;
    border-radius: 3px 22px 3px 22px; border-bottom: 2px solid var(--mn-accent);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
  .brand .ic { width: 22px; height: 22px; color: var(--mn-accent-deep); }
  .views { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .views button {
    border: 1px solid transparent; background: none; padding: 6px 14px; border-radius: var(--cut-sm);
    color: var(--mn-ink-soft); font-weight: 500; white-space: nowrap;
  }
  .views button:hover { background: var(--mn-accent-soft); color: var(--mn-accent-deep); }
  .views button[aria-current="page"] { color: var(--mn-orbit-light); background: var(--mn-orbit-night); border-color: var(--mn-orbit-edge); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
    border: 1px solid var(--mn-glass-border); background: var(--mn-paper); color: var(--mn-ink-soft);
  }
  .icon-btn:hover, .toggle:hover { border-color: var(--mn-accent); color: var(--mn-accent-deep); background: var(--mn-accent-soft); }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--mn-glass-border); background: var(--mn-paper); color: var(--mn-ink-soft); font-size: 13px; font-weight: 500;
  }
  .toggle[aria-pressed="true"] { color: var(--mn-orbit-light); background: var(--mn-orbit-night); border-color: var(--mn-orbit-edge); }
  .lang { height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--mn-glass-border); background: var(--mn-paper); color: var(--mn-ink-soft); }

  /* route heading: moenotes .mn-page-heading */
  .page-head { margin: 26px 0 20px; padding: 0 2px 18px; border-bottom: 1px solid var(--mn-glass-border); }
  .page-head-title { display: flex; align-items: center; gap: 13px; }
  .page-head h1 { margin: 0; min-width: 0; font-size: clamp(26px, 2.8vw, 36px); font-weight: 500; line-height: 1.25; letter-spacing: -.035em; }
  .page-head .star { width: 23px; height: 23px; color: var(--mn-accent-deep); flex: none; }
  .track { flex: 1; min-width: 28px; height: 10px; border-top: 1px solid var(--mn-glass-border); transform: skewY(-3deg); transform-origin: right; }
  .page-head .track { transform: skewY(-1deg); }   /* a wide page: the moenotes skew would cut into the lead */
  .page-head p { max-width: 80ch; margin: 8px 0 0 36px; color: var(--mn-text-muted); font-size: 13px; line-height: 1.85; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 14px; min-width: 0; }
  .sec-head :is(h2, h3) { margin: 0; min-width: 0; font-size: clamp(17px, 1.5vw, 20px); font-weight: 500; line-height: 1.3; letter-spacing: -.02em; }
  .sec-head .star { width: 16px; height: 16px; color: var(--mn-accent-deep); flex: none; }
  .sec-head .track { height: 8px; }
  .sec-head .tail { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  /* filters */
  .filters { display: grid; gap: 12px; padding: 16px 20px; margin-bottom: 18px; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .group-label { font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--mn-text-muted); min-width: 32px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--cut-sm);
    border: 1px solid var(--mn-border); background: var(--mn-glass); color: var(--mn-text); font-size: 13px; font-weight: 500;
  }
  .chip:hover { border-color: var(--mn-accent); background: var(--mn-accent-soft); }
  .chip[aria-pressed="true"] {
    color: var(--mn-orbit-light); background: var(--mn-orbit-night); border-color: var(--mn-orbit-edge); box-shadow: inset 3px 0 0 var(--mn-accent);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .chip.d { min-width: 44px; justify-content: center; font-weight: 600; letter-spacing: .02em; }
  .chip.d[aria-pressed="true"] { color: var(--dc-ink); background: var(--dc-bg); border-color: var(--dc-ink); box-shadow: inset 3px 0 0 var(--dc); }
  .d-easy { --dc: var(--easy); --dc-bg: var(--easy-bg); --dc-ink: var(--easy-ink); --dc-line: var(--easy-line); }
  .d-normal { --dc: var(--normal); --dc-bg: var(--normal-bg); --dc-ink: var(--normal-ink); --dc-line: var(--normal-line); }
  .d-hard { --dc: var(--hard); --dc-bg: var(--hard-bg); --dc-ink: var(--hard-ink); --dc-line: var(--hard-line); }
  .d-expert { --dc: var(--expert); --dc-bg: var(--expert-bg); --dc-ink: var(--expert-ink); --dc-line: var(--expert-line); }
  .search { position: relative; flex: 1 1 240px; max-width: 380px; margin-left: auto; }
  .search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mn-text-muted); pointer-events: none; }
  .search input {
    width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 10px; border: 1px solid var(--mn-border);
    background: var(--mn-paper); color: var(--mn-text);
  }
  .search input::placeholder { color: var(--mn-text-muted); }
  .search input:focus { border-color: var(--mn-accent); outline: none; }

  .main { padding-bottom: 40px; }
  .foot { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 18px 2px 40px; border-top: 1px solid var(--mn-glass-border); color: var(--mn-text-muted); font-size: 12px; }
  .foot a { display: inline-flex; align-items: center; gap: 4px; }

  /* ranking tabs: moenotes .mn-system-tabs */
  .tabs {
    display: flex; gap: 4px; padding: 5px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none;
    border-radius: 2px 14px 2px 14px; border-bottom: 2px solid var(--mn-accent);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: none; padding: 7px 16px; border: 1px solid transparent; border-radius: var(--cut-sm); background: none;
    color: var(--mn-ink-soft); font-weight: 500; white-space: nowrap;
  }
  .tabs button:hover { color: var(--mn-accent-deep); background: var(--mn-accent-soft); }
  .tabs button[aria-selected="true"] { color: var(--mn-orbit-light); background: var(--mn-orbit-night); border-color: var(--mn-orbit-edge); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--mn-border); border-radius: 12px; background: var(--mn-paper); flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 3px 12px; border-radius: 8px; color: var(--mn-ink-soft); font-size: 13px; font-weight: 500; }
  .seg button:hover { color: var(--mn-accent-deep); }
  .seg button[aria-selected="true"] { color: var(--mn-accent-deep); background: var(--mn-accent-soft); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--mn-accent) 30%, transparent); }
  .seg button:disabled { color: var(--mn-text-muted); opacity: .5; cursor: not-allowed; }
  .seg.mini button { min-width: 26px; padding: 2px 7px; font-variant-numeric: tabular-nums; }
  .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 4px 2px 14px; color: var(--mn-text-muted); font-size: 13px; line-height: 1.75; }
  .hint.warn { color: var(--mn-rose); }

  /* settings panel */
  .panel { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 18px; margin: 0 0 16px; border-radius: var(--cut-md); }
  .field { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; white-space: nowrap; color: var(--mn-ink-soft); }
  .field > span:first-child { font-size: 12px; font-weight: 500; color: var(--mn-text-muted); letter-spacing: .02em; }
  .field output { min-width: 40px; color: var(--mn-text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .field select, .num-in {
    height: 32px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--mn-border); background: var(--mn-paper); color: var(--mn-text);
  }
  .num-in { text-align: right; font-variant-numeric: tabular-nums; }
  .num-in:focus, .field select:focus { border-color: var(--mn-accent); outline: none; }
  .num-in.skill { width: 62px; }
  .num-in.power { width: 136px; }
  .num-in::placeholder { color: var(--mn-text-muted); text-align: left; font-size: 12px; }
  input[type=range] { width: 140px; accent-color: var(--mn-accent); }
  input[type=range]:disabled { opacity: .45; cursor: not-allowed; }
  /* play scenario: ranks per range, notes on the approximations */
  .scen .field { white-space: normal; }
  .rk-pick { display: inline-flex; align-items: center; gap: 6px; }
  .rk-pick > small { color: var(--mn-text-muted); font-size: 12px; white-space: nowrap; }
  .note { color: var(--mn-text-muted); font-size: 12px; line-height: 1.6; }
  .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--mn-ink-soft); }
  .check input { accent-color: var(--mn-accent); width: 16px; height: 16px; }
  .skills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .mean { padding: 0 4px; color: var(--mn-accent-deep); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .ghost { height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--mn-border); background: none; color: var(--mn-ink-soft); font-size: 12px; font-weight: 500; }
  .ghost:hover { color: var(--mn-accent-deep); border-color: var(--mn-accent); background: var(--mn-accent-soft); }

  /* ranking table */
  .count { margin: 2px 4px 8px; color: var(--mn-text-muted); font-size: 12px; }
  .table-card { overflow: hidden; border-radius: var(--cut); padding: 0; }
  .table-scroll { overflow-x: auto; }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table th {
    padding: 11px 10px; text-align: right; white-space: nowrap; font-size: 12px; font-weight: 500; color: var(--mn-text-muted);
    background: color-mix(in srgb, var(--mn-cream-deep) 55%, transparent); border-bottom: 1px solid var(--mn-glass-border);
  }
  .rank-table th.c-song, .rank-table th.c-dom, .rank-table th.c-rank { text-align: left; }
  .rank-table th.hi { color: var(--mn-accent-deep); }
  .rank-table td { padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--mn-glass-border) 70%, transparent); }
  .rank-table tbody tr { cursor: pointer; transition: background-color .15s; }
  .rank-table tbody tr:hover { background: color-mix(in srgb, var(--mn-accent-soft) 70%, transparent); }
  .rank-table tbody tr:last-child td { border-bottom: 0; }
  .rank-table .num { text-align: right; }
  .rank-table td.hi { font-weight: 600; color: var(--mn-text); }
  .rank-table .dim, .rank-table small { color: var(--mn-text-muted); }
  .rank-table small { font-size: 11px; font-weight: 400; }
  tr.on-front td.c-rank { box-shadow: inset 3px 0 0 var(--mn-accent); }
  .no { display: inline-grid; place-items: center; min-width: 28px; height: 26px; padding: 0 4px; border-radius: 2px 9px 2px 9px; color: var(--mn-text-muted); font-family: var(--mn-font-note); font-size: 12px; }
  .no.top { color: var(--mn-orbit-light); background: var(--mn-orbit-night); border: 1px solid var(--mn-orbit-edge); font-weight: 600; }
  .song { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .song-text { min-width: 0; }
  .song-title { display: flex; align-items: center; gap: 4px; font-weight: 500; }
  .song-title .t { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .song-band { display: flex; align-items: center; gap: 6px; color: var(--mn-text-muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .moe { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--mn-text-muted); }
  .moe .ic { width: 14px; height: 14px; }
  .moe:hover { color: var(--mn-accent-deep); background: var(--mn-accent-soft); }
  .jk {
    --band: #8a93a6; position: relative; flex: none; display: grid; place-items: center; overflow: hidden;
    width: 40px; height: 40px; border-radius: 2px 10px 2px 10px; border: 1px solid var(--mn-glass-border);
    background: linear-gradient(135deg, color-mix(in srgb, var(--band) 55%, var(--mn-paper)), var(--mn-cream-deep));
  }
  .jk img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .jk-fallback { font-weight: 600; color: var(--mn-paper); text-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
  .jk.sm { width: 34px; height: 34px; }
  .jk.xl { width: 132px; height: 132px; border-radius: 3px 22px 3px 22px; font-size: 40px; box-shadow: var(--mn-glass-shadow); }
  .lv {
    display: inline-flex; align-items: baseline; gap: 4px; min-width: 50px; justify-content: center; padding: 1px 7px;
    border-radius: 5px; border: 1px solid var(--dc-line); background: var(--dc-bg); color: var(--dc-ink); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .lv small { font-size: 9px; font-weight: 600; opacity: .7; letter-spacing: .02em; }
  .bar {
    display: inline-block; min-width: 88px; padding: 1px 8px; border-radius: 4px; text-align: right;
    background: linear-gradient(90deg, color-mix(in srgb, var(--mn-accent) 24%, transparent) var(--w), color-mix(in srgb, var(--mn-accent) 5%, transparent) var(--w));
  }
  .front { display: inline-flex; align-items: center; gap: 4px; color: var(--mn-accent-deep); font-size: 12px; font-weight: 500; }
  .front .ic { width: 13px; height: 13px; }
  .beaten { color: var(--mn-text-muted); font-size: 12px; cursor: help; border-bottom: 1px dotted var(--mn-border); }
  .spread { font-size: 11px; }
