<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Chart data</title>
<!-- Chart data of a site: rankings (efficiency, speed, level, notes, length, skip), charts and a guide over the site's
     songs.json (nnnotes songs), chart-stats.json (ournotes-deck chart-stats, optional) and jackets/ (nnnotes songs
     --jackets, optional). Songs link to their moenotes page. See songs.js for the query parameters. -->
<style>
  :root {
    --bg: #0b0d12; --bg2: #10131a; --panel: #151a23; --panel2: #1b212c; --line: #252c39; --line2: #2f3747;
    --text: #e8eaf0; --muted: #8f98ab; --dim: #5f6879; --accent: #8fb0ff; --gold: #f5c451;
    --easy: #4a8cff; --normal: #3fbf6a; --hard: #f2a33a; --expert: #ef4d6b;
    --radius: 14px; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    --font: "Noto Sans SC", "Noto Sans JP", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(120, 140, 255, .10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(239, 77, 107, .08), transparent 60%),
      var(--bg);
  }
  body.locked { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  .top {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px;
    padding: 12px max(16px, calc((100vw - 1240px) / 2)); background: rgba(11, 13, 18, .78);
    backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .02em; }
  .logo {
    display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #fff; font-size: 16px;
    background: linear-gradient(135deg, #7c8cff, #ef4d6b); box-shadow: 0 4px 14px rgba(239, 77, 107, .35);
  }
  .views { display: flex; gap: 4px; flex: 1; }
  .views button { background: none; border: 0; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
  .views button:hover { color: var(--text); background: var(--panel); }
  .views button.on { color: var(--text); background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); }
  .lang { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; }

  /* filters */
  .filters { padding: 14px max(16px, calc((100vw - 1240px) / 2)) 4px; display: grid; gap: 10px; }
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    --c: var(--accent); display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line2); color: var(--muted); transition: .15s;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; }
  .chip:hover { color: var(--text); border-color: var(--c); }
  .chip.on { color: #fff; background: color-mix(in srgb, var(--c) 28%, var(--panel)); border-color: var(--c); }
  .chip.diff.on { background: var(--c); }
  .search {
    flex: 1; min-width: 200px; max-width: 360px; margin-left: auto; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line2);
  }
  .search::placeholder { color: var(--dim); }

  .main { padding: 8px max(16px, calc((100vw - 1240px) / 2)) 32px; }
  .foot { padding: 20px max(16px, calc((100vw - 1240px) / 2)) 40px; color: var(--dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 8px 24px; border-top: 1px solid var(--line); }
  .foot a { color: var(--muted); }

  /* segmented controls, panels */
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; padding: 4px 12px; border-radius: 8px; color: var(--muted); }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--panel2); color: var(--text); box-shadow: 0 1px 0 rgba(255, 255, 255, .05), 0 2px 8px rgba(0, 0, 0, .3); }
  .seg.big button { padding: 7px 16px; font-weight: 600; }
  .seg.big button.on { background: linear-gradient(135deg, #2c3a66, #3a2440); color: #fff; }
  .rank-head { margin: 8px 0 6px; }
  .hint { color: var(--muted); margin: 6px 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .hint.warn { color: var(--hard); }
  .panel {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 12px 16px; margin: 0 0 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .field { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; flex-wrap: wrap; }
  .field > span:first-child { font-size: 12px; }
  .field input[type=range] { width: 150px; accent-color: var(--accent); }
  .field output { color: var(--text); min-width: 44px; font-variant-numeric: tabular-nums; }
  .field select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; }
  .field.check { cursor: pointer; }
  .field.check input { accent-color: var(--gold); }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .skill { width: 58px; padding: 3px 6px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line2); text-align: right; font-variant-numeric: tabular-nums; }
  .ghost { background: none; border: 1px solid var(--line2); color: var(--muted); border-radius: 8px; padding: 3px 10px; }
  .ghost:hover { color: var(--text); border-color: var(--accent); }

  /* table */
  .count { color: var(--dim); font-size: 12px; margin: 4px 2px 8px; }
  .table-scroll { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg2); }
  .rank-table { width: 100%; border-collapse: collapse; }
  .rank-table th {
    position: sticky; top: 0; padding: 10px; text-align: right; font-size: 12px; font-weight: 500; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .rank-table th.c-song, .rank-table th.c-dom, .rank-table th.c-rank { text-align: left; }
  .rank-table th.hi { color: var(--text); }
  .rank-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .rank-table tbody tr { cursor: pointer; transition: background .12s; }
  .rank-table tbody tr:hover { background: rgba(143, 176, 255, .06); }
  .rank-table tbody tr:last-child td { border-bottom: 0; }
  .rank-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-table td.hi { color: #fff; font-weight: 600; }
  .rank-table .dim { color: var(--muted); }
  .rank-table small { color: var(--dim); }
  tr.on-front td.c-rank { box-shadow: inset 3px 0 var(--gold); }
  .no { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .no.n1 { background: linear-gradient(135deg, #f7d774, #c9962c); color: #231a05; font-weight: 700; }
  .no.n2 { background: linear-gradient(135deg, #e3e7ef, #9aa3b5); color: #151a23; font-weight: 700; }
  .no.n3 { background: linear-gradient(135deg, #f0b48a, #a8653a); color: #231205; font-weight: 700; }
  .song { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .song-text { min-width: 0; }
  .song-title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .song-title .t { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .song-band { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .song-band i, .d-band i, .legend i, .comp-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .moe { color: var(--dim); text-decoration: none; font-size: 12px; padding: 0 4px; border-radius: 4px; }
  .moe:hover { color: var(--accent); background: rgba(143, 176, 255, .12); }
  .jk {
    --band: #8a93a6; position: relative; flex: none; display: grid; place-items: center; overflow: hidden;
    width: 40px; height: 40px; border-radius: 9px; background: linear-gradient(135deg, var(--band), #1b212c);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .jk img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .jk-fallback { font-weight: 700; color: rgba(255, 255, 255, .8); }
  .jk.sm { width: 34px; height: 34px; border-radius: 7px; }
  .jk.xl { width: 148px; height: 148px; border-radius: 16px; font-size: 42px; box-shadow: var(--shadow); }
  .lv { display: inline-block; min-width: 38px; padding: 1px 6px; border-radius: 7px; text-align: center; color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lv.easy { background: var(--easy); } .lv.normal { background: var(--normal); } .lv.hard { background: var(--hard); } .lv.expert { background: var(--expert); }
  .bar {
    display: inline-block; min-width: 84px; padding: 1px 8px; border-radius: 6px; text-align: right;
    background: linear-gradient(90deg, rgba(143, 176, 255, .28) var(--w), rgba(143, 176, 255, .05) var(--w));
  }
  .front { color: var(--gold); font-size: 12px; font-weight: 600; }
  .beaten { color: var(--dim); font-size: 12px; cursor: help; }

  /* cards and charts */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 8px 0 16px; }
  .card .panel { background: var(--bg2); }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .card h2 { margin: 0; font-size: 15px; }
  .axes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .swap { padding: 2px 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid2 > .card { margin: 0; }
  .plot { width: 100%; height: auto; display: block; }
  .plot .grid line { stroke: var(--line); }
  .plot .grid text, .plot .tick { fill: var(--dim); font-size: 11px; }
  .plot .axis-label { fill: var(--muted); font-size: 12px; }
  .plot .dots circle { stroke-width: 2; fill-opacity: .85; cursor: pointer; transition: r .1s; }
  .plot .dots circle:hover { r: 8; fill-opacity: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12px; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .ring { background: none; border: 2px solid; width: 10px; height: 10px; }
  .legend-sep { width: 1px; height: 12px; background: var(--line2); }
  .hbars { display: grid; gap: 10px; padding-top: 6px; }
  .hbar { display: grid; grid-template-columns: 140px 1fr 32px; align-items: center; gap: 10px; }
  .hbar-name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { height: 12px; border-radius: 6px; background: var(--bg2); overflow: hidden; }
  .hbar-fill { display: block; height: 100%; border-radius: 6px; }
  .hbar b { text-align: right; font-variant-numeric: tabular-nums; }
  .tip {
    position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; min-width: 190px; max-width: 280px; padding: 10px 12px;
    background: rgba(21, 26, 35, .96); border: 1px solid var(--line2); border-radius: 12px; box-shadow: var(--shadow); font-size: 12px;
  }
  .tip-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .tip-title { font-weight: 600; font-size: 13px; }
  .tip-sub { color: var(--muted); }
  .tip-row { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  .tip-row b { color: var(--text); font-variant-numeric: tabular-nums; }

  /* guide */
  .guide { max-width: 1000px; }
  .guide h1 { font-size: 26px; margin: 12px 0 6px; }
  .lead { color: var(--muted); font-size: 15px; max-width: 820px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .toc a { padding: 4px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); color: var(--muted); text-decoration: none; }
  .toc a:hover { color: var(--text); border-color: var(--accent); }
  .formula { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 20px; }
  .formula code { padding: 8px 14px; border-radius: 10px; background: linear-gradient(135deg, rgba(124, 140, 255, .14), rgba(239, 77, 107, .10)); border: 1px solid var(--line2); font-size: 13px; }
  .g-section { margin: 26px 0; scroll-margin-top: 70px; }
  .g-section h2 { font-size: 18px; margin: 0 0 4px; padding-left: 10px; border-left: 3px solid var(--accent); }
  .g-intro { color: var(--muted); margin: 4px 0 12px; }
  .terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 10px; }
  .term { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .term h3 { margin: 0 0 6px; font-size: 14px; }
  .term p { margin: 0; color: #c4c9d4; }
  .term .why { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line2); color: var(--gold); font-size: 13px; }
  .term .why::before { content: "▸ "; }
  .scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 10px; }
  .scene { padding: 14px; border-radius: var(--radius); background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line); }
  .scene h3 { margin: 0 0 6px; font-size: 15px; }
  .where { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 999px; background: rgba(143, 176, 255, .14); color: var(--accent); margin-bottom: 8px; }
  .scene p { margin: 0; color: #c4c9d4; }

  /* chart detail drawer */
  .drawer-wrap { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(4, 5, 8, .6); backdrop-filter: blur(4px); }
  .drawer-wrap.open { display: block; }
  .drawer {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(920px, 100%); overflow-y: auto; background: var(--bg2);
    border-left: 1px solid var(--line); box-shadow: var(--shadow); animation: slide .22s ease-out;
  }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  .d-hero { --band: #8a93a6; position: relative; display: flex; gap: 20px; align-items: flex-end; padding: 28px 24px 20px; overflow: hidden; background: linear-gradient(160deg, color-mix(in srgb, var(--band) 30%, transparent), transparent 70%); }
  .d-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.3); opacity: .35; }
  .d-hero > *:not(.d-bg):not(.d-close) { position: relative; }
  .d-title { flex: 1; min-width: 0; }
  .d-title h2 { margin: 4px 0 10px; font-size: 24px; line-height: 1.25; }
  .d-band { display: flex; align-items: center; gap: 6px; color: #cfd4de; }
  .d-diffs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .lv-tab { display: inline-flex; flex-direction: column; align-items: center; min-width: 64px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(11, 13, 18, .5); color: var(--muted); }
  .lv-tab span { font-size: 11px; } .lv-tab b { font-size: 16px; color: var(--text); }
  .lv-tab.on { color: #fff; border-color: transparent; }
  .lv-tab.easy.on { background: var(--easy); } .lv-tab.normal.on { background: var(--normal); } .lv-tab.hard.on { background: var(--hard); } .lv-tab.expert.on { background: var(--expert); }
  .lv-tab.on b { color: #fff; }
  .moe-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 999px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18); color: #fff; text-decoration: none; font-weight: 600; }
  .moe-btn:hover { background: rgba(255, 255, 255, .18); }
  .d-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .35); color: #fff; font-size: 15px; }
  .d-body { padding: 8px 24px 28px; }
  .d-body h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; letter-spacing: .04em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
  .tile { padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 2px; }
  .tile span { color: var(--muted); font-size: 12px; }
  .tile b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--dim); font-size: 11px; }
  .timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
  .timeline .lane { fill: var(--muted); font-size: 11px; }
  .timeline .lane-line { stroke: var(--line); stroke-dasharray: 2 4; }
  .timeline .fever { fill: #f5c451; fill-opacity: .55; }
  .timeline .skill { fill: #8fb0ff; }
  .timeline .skill-no { fill: #0b0d12; font-size: 11px; font-weight: 700; }
  .timeline .span { fill: #3fd0a8; fill-opacity: .6; }
  .timeline .bpm-line { fill: none; stroke: #ff6b9a; stroke-width: 2; }
  .comp-bar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--panel); }
  .comp-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .comp-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .comp-legend b { color: var(--text); }
  .weights { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; }
  .wcol { display: grid; justify-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .wcol b { font-size: 12px; }
  .wbar { display: flex; align-items: flex-end; width: 100%; max-width: 46px; height: 90px; border-radius: 8px; background: var(--panel); overflow: hidden; }
  .wbar span { width: 100%; background: linear-gradient(180deg, #8fb0ff, #4a5f9c); border-radius: 8px 8px 0 0; }
  .wcol.best .wbar span { background: linear-gradient(180deg, #f7d774, #c9962c); }
  .wpos { font-weight: 700; }
  .wcol small { color: var(--dim); font-size: 11px; }
  .ids { color: var(--dim); font-size: 12px; margin-top: 18px; }

  .boot { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 60vh; color: var(--muted); }
  .boot.error { color: var(--expert); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 860px) {
    .grid2 { grid-template-columns: 1fr; }
    .rank-table .c-bpm, .rank-table .c-notes, .rank-table .c-rate, .rank-table .c-relative, .rank-table .c-dom { display: none; }
    .rank-table .c-bpm.hi, .rank-table .c-notes.hi { display: table-cell; }
  }
  @media (max-width: 600px) {
    .top { gap: 10px; flex-wrap: wrap; }
    .brand span:last-child { display: none; }
    .views { order: 3; width: 100%; }
    .search { max-width: none; margin-left: 0; }
    .rank-table .c-density, .rank-table .c-time { display: none; }
    .rank-table .c-density.hi, .rank-table .c-time.hi { display: table-cell; }
    .rank-table td, .rank-table th { padding: 7px 5px; }
    .rank-table th { white-space: normal; }
    .bar { min-width: 52px; padding: 1px 4px; }
    .no { min-width: 22px; height: 22px; }
    .tl-scroll { overflow-x: auto; }
    .tl-scroll .timeline { min-width: 620px; }
    .song-title .t { max-width: 34vw; }
    .song-band { display: none; }
    .jk { width: 34px; height: 34px; }
    .d-hero { flex-direction: column; align-items: flex-start; padding: 20px 16px 16px; }
    .jk.xl { width: 96px; height: 96px; }
    .d-body { padding: 4px 16px 24px; }
    .hbar { grid-template-columns: 96px 1fr 28px; }
    .field input[type=range] { width: 110px; }
  }
</style>
<script type="module" src="songs.js"></script>
</head>
<body></body>
</html>
